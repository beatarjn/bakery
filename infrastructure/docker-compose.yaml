services:
  buns:
    container_name: buns_app
    build:
      context: ../
      dockerfile: infrastructure/buns_store/service/Dockerfile
    ports:
      - 8060:8020

  bakery_db:
    container_name: db_app
    build:
      context: ./bakery_service/database
      dockerfile: Dockerfile
    ports:
      - 5555:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}

  bakery:
    container_name: bakery_app
    build:
      context: ../
      dockerfile: infrastructure/bakery_service/service/Dockerfile
    ports:
      - 8070:8010
    environment:
      - DATABASE_PORT=5432
      - DATABASE_NAME=bakerydb
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_USERNAME=${DB_USERNAME}
      - DATABASE_HOST=bakery_db
    depends_on:
      - bakery_db


  kafka0:
    image: docker.io/bitnami/kafka:4.0
    hostname: kafka0
    container_name: kafka0
    ports:
      - 9094:9092
      - 29092:29092
    expose:
      - '9092'
      - '29092'
      - '9094'
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9092; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # Kraft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka0:9093,1@kafka1:9093,2@kafka2:9093
      - KAFKA_KRAFT_CLUSTER_ID=pop-cluster
      # Listeners
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka0:29092,PLAINTEXT_HOST://localhost:9094
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
    volumes:
      - kafka0_data:/bitnami/kafka

  kafka1:
    image: docker.io/bitnami/kafka:4.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - 9095:9092
      - 29093:29092
    expose:
      - '9092'
      - '9095'
      - '29092'
    environment:
      # Kraft settings
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka0:9093,1@kafka1:9093,2@kafka2:9093
      - KAFKA_KRAFT_CLUSTER_ID=pop-cluster
      # Listeners
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9095
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
    volumes:
      - kafka1_data:/bitnami/kafka

  kafka2:
    image: docker.io/bitnami/kafka:4.0
    hostname: kafka2
    container_name: kafka2
    ports:
      - 9096:9092
      - 29094:29092
    expose:
      - '9092'
      - '29092'
      - '9096'
    environment:
      # Kraft settings
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka0:9093,1@kafka1:9093,2@kafka2:9093
      - KAFKA_KRAFT_CLUSTER_ID=pop-cluster
      # Listeners
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9096
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
    volumes:
      - kafka2_data:/bitnami/kafka

  init-kafka:
    image: docker.io/bitnami/kafka:latest
    working_dir: /opt/bitnami/kafka/bin
    depends_on:
      - kafka0
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Start. Listing current topics. Still  can show warnings, ignore them for now.'
      
      kafka-topics.sh --bootstrap-server kafka0:29092 --list
      
      echo -e 'Creating kafka topics'
      kafka-topics.sh --bootstrap-server kafka0:29092 --create --if-not-exists --topic Topic1 --replication-factor 1 --partitions 4
      echo -e 'Creating kafka topics'
      kafka-topics.sh --bootstrap-server kafka0:29092 --create --if-not-exists --topic Topic2 --replication-factor 1 --partitions 4
      
      echo -e 'Successfully created the following topics:'
      kafka-topics.sh --bootstrap-server kafka0:29092 --describe
      echo -e 'The end.'
      
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka0
      - kafka1
      - kafka2
    environment:
      - KAFKA_CLUSTERS_0_NAME=pop-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka0:29092,kafka1:29092,kafka2:29092

volumes:
  kafka0_data:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local

